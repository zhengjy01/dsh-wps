# dsh-wps bundle patch: inserts the plugin row into the profile roster.
# Applied as a profile bundle layer (declared by the `dsh.bundle.patch`
# manifest field in package.json). Activate with:
#
#   # local development (link)
#   dsh plugin --profile web add link:/Users/zhengjunyao/Documents/DSH /DSH-test/dsh-wps
- insert:
    - id: wps
      name: dsh-wps
      config:
        announceToAgent: true   # 在系统提示中公告插件（工具 + 能力说明）
        enabled: true           # 插件总开关
